<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Akash Ajith</title>
  <desc id="desc">Third-year B.Tech Computer Science student at Cochin University of Science and Technology. Web development internships at Tatos and Ariussoft.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0d1117"/><stop offset=".45" stop-color="#180a2e"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="aura" cy="45%" r="60%">
      <stop stop-color="#7e15f7" stop-opacity=".55"/><stop offset="1" stop-color="#7e15f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon">
      <stop stop-color="#b347ff"/><stop offset=".5" stop-color="#ff6ef7"/><stop offset="1" stop-color="#7e15f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"><animate attributeName="stdDeviation" values="3;8;3" dur="3s" repeatCount="indefinite"/></feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" fill="url(#background)"/>
  <rect width="1200" height="340" fill="url(#aura)"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></rect>
  <g fill="none" stroke="#7e15f7" stroke-opacity=".35" stroke-width="1.5">
    <path d="M0 60H260L300 100H520" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="6s" repeatCount="indefinite"/></path>
    <path d="M1200 280H900L860 240H640" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="7s" repeatCount="indefinite"/></path>
    <path d="M0 300H160L200 260H420" stroke-dasharray="6 12"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="5s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#b347ff">
    <circle cx="120" cy="300" r="2.5"><animate attributeName="cy" values="340;0" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="300" r="2" fill="#ff6ef7"><animate attributeName="cy" values="340;0" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="300" r="3"><animate attributeName="cy" values="340;0" dur="6s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="300" r="2" fill="#ff6ef7"><animate attributeName="cy" values="340;0" dur="8s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="300" r="2.5"><animate attributeName="cy" values="340;0" dur="7.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="300" r="2" fill="#ff6ef7"><animate attributeName="cy" values="340;0" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="150" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="72" font-weight="900" letter-spacing="4" fill="url(#neon)" filter="url(#glow)">AKASH AJITH</text>
  <g text-anchor="middle" font-family="'Courier New', monospace" font-size="27" fill="#e6e6ff">
    <text x="600" y="210">Third-Year B.Tech Computer Science | CUSAT<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.22;.25;.97;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="600" y="210" opacity="0">Web Development | React + Node.js + Supabase<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.25;.28;.47;.5;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="600" y="210" opacity="0">PHP + HTML + CSS + Bootstrap<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5;.53;.72;.75;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="600" y="210" opacity="0">Web Development Internships | Tatos + Ariussoft<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.75;.78;.94;.97;1" dur="16s" repeatCount="indefinite"/></text>
  </g>
  <text x="600" y="270" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" letter-spacing="2" fill="#9b8bbf">COCHIN UNIVERSITY OF SCIENCE AND TECHNOLOGY</text>
  <rect y="332" width="1200" height="3" fill="url(#neon)" opacity=".7"/>
</svg>
